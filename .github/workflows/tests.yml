name: Tests

on: [workflow_call, pull_request]
permissions:
  contents: read

jobs:
  frontend:
    if: ${{ github.actor != 'renovate[bot]' }}
    name: Run frontend tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Build frontend image
        run: docker build --file Dockerfile.dev --tag labtool-frontend:ci .

      - name: Run frontend linting
        run: docker run --rm labtool-frontend:ci npm run lint

      - name: Run frontend tests
        run: docker run --rm labtool-frontend:ci npm run test

  backend:
    if: ${{ github.actor != 'renovate[bot]' }}
    name: Run backend linting
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v6

      - name: Build backend image
        run: docker build --file backend/Dockerfile.dev --tag labtool-backend:ci backend

      - name: Run backend linting
        run: docker run --rm labtool-backend:ci npm run lint

  backend-tests:
    if: ${{ github.actor != 'renovate[bot]' }}
    name: Run backend API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v6

      - name: Run backend API tests against Postgres
        working-directory: backend
        run: sh bin/test-docker.sh

  e2e:
    if: ${{ github.actor != 'renovate[bot]' }}
    name: Run e2e tests
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run e2e tests against the docker compose stack
        working-directory: e2e
        run: npm run e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7
