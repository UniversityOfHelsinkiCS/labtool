name: Release to production

on:
  release:
    types: [published]

jobs:
  test:
    if: ${{ github.actor != 'renovate[bot]' }}
    uses: ./.github/workflows/tests.yml
    secrets: inherit

  release-frontend:
    needs: test
    if: ${{ github.actor != 'renovate[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: labtool-frontend
          tags: production ${{ github.sha }}
          containerfiles: |
            ./Dockerfile

      - name: Push to version helsinki
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: registry.version.helsinki.fi/toska/openshift/kontit/
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}

  release-backend:
    needs: test
    if: ${{ github.actor != 'renovate[bot]' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build image
        id: build-image
        uses: redhat-actions/buildah-build@v2
        with:
          image: labtool-backend
          tags: production ${{ github.sha }}
          context: ./backend
          containerfiles: |
            ./backend/Dockerfile
          build-args: |
            NODE_ENV=production

      - name: Push to version helsinki
        uses: redhat-actions/push-to-registry@v2
        with:
          image: ${{ steps.build-image.outputs.image }}
          tags: ${{ steps.build-image.outputs.tags }}
          registry: registry.version.helsinki.fi/toska/openshift/kontit/
          username: kontit
          password: ${{ secrets.VERSION_PUSH_SECRET }}
